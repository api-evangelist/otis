description: Otis was an alternative-asset investing platform that let retail investors buy fractional
  shares in collectibles such as contemporary art, sneakers, trading cards, comics, and cultural
  memorabilia, backed by Kindred Ventures and Union Square Ventures. Otis was acquired by Public
  Holdings (Public.com) in 2022 and folded into Public's alternative-assets investing product;
  its former domain withotis.com now 301-redirects to public.com. The standalone Otis brand is
  defunct and exposes no independent developer or API surface as of this enrichment pass.
